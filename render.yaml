# One-click deploy on Render (render.com → New → Blueprint). Uses a persistent disk for the SQLite DB.
services:
  - type: web
    name: arzon-woxsen
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/arzon.db
      - key: IP_SALT
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
